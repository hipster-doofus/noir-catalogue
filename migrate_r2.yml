name: Migrate Existing Media to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (preview files without uploading or deleting)'
        required: true
        default: false
        type: boolean
      keep_local:
        description: 'Keep local MP4 files in Git after uploading to R2'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  migrate-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Migration Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 supabase requests

      - name: Run Cloudflare R2 Migration
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          KEEP_LOCAL: ${{ inputs.keep_local }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$KEEP_LOCAL" = "true" ]; then
            ARGS="$ARGS --keep-local"
          fi
          python migrate_to_r2.py $ARGS

      - name: Commit Updated Catalog & Pruned Binaries
        if: ${{ !inputs.dry_run }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A output/
          git add catalog.json 2>/dev/null || true

          git status
          git diff --quiet && git diff --staged --quiet || git commit -m "Migrate media assets to Cloudflare R2 and prune Git binaries [skip ci]"

          for i in {1..3}; do
            git push origin HEAD && break || {
              echo "Push failed, retrying in $((i * 5)) seconds..."
              sleep $((i * 5))
            }
          done
