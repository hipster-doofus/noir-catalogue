name: Extract Scenes & Publish Web Vault

on:
  workflow_dispatch:
    inputs:
      genre_keyword:
        description: 'Genre / Search Keyword'
        required: true
        default: 'film noir'
        type: choice
        options:
          - 'film noir'
          - 'crime noir'
          - 'mystery'
          - 'sci-fi'
          - 'horror'
          - 'western'
          - 'silent film'

      num_movies:
        description: 'Number of Movies to Process'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'

      clips_per_movie:
        description: 'Clips to Extract Per Movie'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'

      min_clip_len:
        description: 'Min Clip Duration (Seconds)'
        required: true
        default: '8'

      max_clip_len:
        description: 'Max Clip Duration (Seconds)'
        required: true
        default: '60'

      start_year:
        description: 'Filter Release Year Start'
        required: false
        default: '1930'

      end_year:
        description: 'Filter Release Year End'
        required: false
        default: '1960'

      license_type:
        description: 'License Type'
        required: true
        default: 'Public Domain'
        type: choice
        options:
          - 'Public Domain'
          - 'Creative Commons'
          - 'Any / Open Archive'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests scenedetect[opencv] faster-whisper imageio-ffmpeg supabase google-genai

      - name: Run Extraction Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GENRE_KEYWORD: ${{ inputs.genre_keyword || 'film noir' }}
          NUM_MOVIES: ${{ inputs.num_movies || '3' }}
          CLIPS_PER_MOVIE: ${{ inputs.clips_per_movie || '3' }}
          MIN_CLIP_LEN: ${{ inputs.min_clip_len || '8' }}
          MAX_CLIP_LEN: ${{ inputs.max_clip_len || '60' }}
          START_YEAR: ${{ inputs.start_year || '1930' }}
          END_YEAR: ${{ inputs.end_year || '1960' }}
          LICENSE_TYPE: ${{ inputs.license_type || 'Public Domain' }}
        run: python extract_and_index.py

      - name: Upload Extracted Media Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noir-vault-assets-${{ github.run_id }}
          path: |
            output/**/*.mp4
            output/*.zip
            output/*.db
            output/catalog.json
            output/*.jpg
