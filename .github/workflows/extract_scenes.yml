name: Extract Film Noir Scenes & Index to Supabase

on:
  workflow_dispatch:
    inputs:
      movie_id:
        description: 'Optional Archive.org Identifier (leave empty for random classic)'
        required: false
        default: ''
  # Optional: Automatically run once a week or month on cron:
  # schedule:
  #   - cron: '0 12 * * 1'

jobs:
  build-extract-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to publish GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Extraction & Supabase Cloud Indexer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MOVIE_ID_OVERRIDE: ${{ github.event.inputs.movie_id }}
        run: |
          python extract_and_index.py

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: noir-scenes-bundle
          path: output/
          retention-days: 14

      - name: Publish GitHub Release with Direct Download Links
        uses: softprops/action-gh-release@v2
        if: env.ZIP_FILE_PATH != ''
        with:
          tag_name: release-${{ env.TIMESTAMP }}
          name: "Film Noir: ${{ env.MOVIE_TITLE }} (${{ env.TIMESTAMP }})"
          body_path: output/scenes_summary.txt
          files: |
            ${{ env.ZIP_FILE_PATH }}
            output/film_noir_scenes.db
            output/*.mp4
            output/*.jpg
