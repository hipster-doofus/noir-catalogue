name: Extract Scenes & Publish Web Vault

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      source_provider:
        description: 'Source Archive Provider'
        required: true
        default: 'Internet Archive'
        type: choice
        options:
          - 'Internet Archive'
          - 'Library of Congress'
          - 'Any / Blended'
      archive_category:
        description: 'Archive Sub-Category (Internet Archive)'
        required: true
        default: 'feature_films'
        type: choice
        options:
          - 'feature_films'
          - 'moviesandfilms'
          - 'prelinger'
          - 'all_movies'
      genre_keyword:
        description: 'Genre / Search Keyword'
        required: true
        default: 'film noir'
        type: choice
        options:
          - 'any'
          - 'film noir'
          - 'crime noir'
          - 'mystery'
          - 'sci-fi'
          - 'horror'
          - 'western'
          - 'silent film'
      num_movies:
        description: 'Number of Movies to Process'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
      clips_per_movie:
        description: 'Clips to Extract Per Movie'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
      min_clip_len:
        description: 'Min Clip Duration (Seconds)'
        required: true
        default: '8'
      max_clip_len:
        description: 'Max Clip Duration (Seconds)'
        required: true
        default: '60'
      start_year:
        description: 'Filter Release Year Start'
        required: false
        default: '1930'
      end_year:
        description: 'Filter Release Year End'
        required: false
        default: '1960'
      license_type:
        description: 'License Type'
        required: true
        default: 'any'
        type: choice
        options:
          - 'any'
          - 'Public Domain'
          - 'Creative Commons'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests scenedetect[opencv] faster-whisper imageio-ffmpeg supabase google-genai

      - name: Uncache Output Directory to Fix Git Tracking Cache
        run: |
          git rm -r --cached output/ 2>/dev/null || true
          mkdir -p output

      - name: Run Extraction Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SOURCE_PROVIDER: ${{ inputs.source_provider || 'Internet Archive' }}
          ARCHIVE_CATEGORY: ${{ inputs.archive_category || 'feature_films' }}
          GENRE_KEYWORD: ${{ inputs.genre_keyword || 'film noir' }}
          NUM_MOVIES: ${{ inputs.num_movies || '3' }}
          CLIPS_PER_MOVIE: ${{ inputs.clips_per_movie || '3' }}
          MIN_CLIP_LEN: ${{ inputs.min_clip_len || '8' }}
          MAX_CLIP_LEN: ${{ inputs.max_clip_len || '60' }}
          START_YEAR: ${{ inputs.start_year || '1930' }}
          END_YEAR: ${{ inputs.end_year || '1960' }}
          LICENSE_TYPE: ${{ inputs.license_type || 'any' }}
        run: python extract_and_index.py

      - name: Clean Up Files Over 50MB
        run: |
          if [ -f cleanup_large_files.py ]; then
            python cleanup_large_files.py
          fi

      - name: Verify Output Files
        run: |
          echo "=== Files Present in output/ ==="
          ls -lh output/ || echo "output folder does not exist"
          git status --ignored

      - name: Commit & Push MP4 Clips and Metadata to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage untracked files and handle deleted file records
          git add -A output/
          git add index.html catalog.json 2>/dev/null || true
          
          git status
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update catalog and MP4 scenes [skip ci]"
          
          # Retry loop to handle transient network drops during push
          for i in {1..3}; do
            git push origin HEAD:main && break || {
              echo "Push failed, retrying in $((i * 5)) seconds..."
              sleep $((i * 5))
            }
          done
