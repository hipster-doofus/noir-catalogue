name: Run Search, Extract & Index Pipeline

on:
  workflow_dispatch:
    inputs:
      num_movies:
        description: 'Number of movies to process (1-10)'
        required: false
        default: '3'
      movie_id:
        description: 'Specific Archive ID or Title Override (Optional)'
        required: false
        default: ''
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC

jobs:
  extract-and-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg (Static Binary - Ultra Fast)
        run: |
          mkdir -p ~/.local/bin
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ --strip-components=1 -C ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests imageio-ffmpeg scenedetect[opencv] faster-whisper google-genai supabase yt-dlp

      - name: Run Multi-Source Extraction & Indexer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NUM_MOVIES: ${{ github.event.inputs.num_movies || '3' }}
          MOVIE_ID_OVERRIDE: ${{ github.event.inputs.movie_id }}
        run: |
          python extract_and_index.py

      - name: Upload Extracted Media Artifacts (MP4, ZIP & DB)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-noir-extracted-scenes-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.zip
            output/*.db
            output/catalog.json
            output/*.jpg
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && env.ZIP_FILE_PATH != ''
        with:
          tag_name: release-${{ env.TIMESTAMP }}
          name: "Noir Vault: Films (${{ env.TIMESTAMP }})"
          body: |
            Automated Scene Extraction & Cloud Indexing Run Complete.
            Processed Movies: ${{ env.MOVIE_COUNT }}
          files: |
            output/*.zip
            output/*.mp4
            output/*.db
            output/catalog.json
          fail_on_unmatched_files: false
