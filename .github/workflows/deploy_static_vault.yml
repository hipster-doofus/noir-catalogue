name: Deploy Static Vault to Multi-Cloud Hosts

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'dev/**'
      - 'test/**'
    paths:
      - 'index.html'
      - 'social.html'
      - 'studio.html'
      - 'vj_scratch.html'
      - 'catalog.json'
      - 'output/**'
      - '.github/workflows/deploy_static_vault.yml'
  workflow_run:
    workflows: ["Extract Scenes & Publish Web Vault"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  # ---------------------------------------------------------
  # 1. Cloudflare Pages (Top Pick - Unlimited Bandwidth)
  # ---------------------------------------------------------
  deploy-cloudflare-pages:
    if: ${{ vars.ENABLE_CLOUDFLARE != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Secrets
        id: check_cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "Skipping Cloudflare Pages: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set."
          fi

      - name: Checkout Repository
        if: steps.check_cf.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Prepare Clean Static Bundle
        if: steps.check_cf.outputs.ready == 'true'
        run: |
          mkdir -p _site/output
          cp -f index.html social.html studio.html vj_scratch.html catalog.json _site/ 2>/dev/null || true
          cp -rf output/* _site/output/ 2>/dev/null || true

      - name: Publish to Cloudflare Pages
        if: steps.check_cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'noir-vault' }} --branch=${{ github.ref_name }}

  # ---------------------------------------------------------
  # 2. Netlify (Branch Previews & 100GB/mo Free)
  # ---------------------------------------------------------
  deploy-netlify:
    if: ${{ vars.ENABLE_NETLIFY != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Netlify Secrets
        id: check_netlify
        run: |
          if [ -n "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] && [ -n "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "Skipping Netlify: NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID not set."
          fi

      - name: Checkout Repository
        if: steps.check_netlify.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Prepare Clean Static Bundle
        if: steps.check_netlify.outputs.ready == 'true'
        run: |
          mkdir -p _site/output
          cp -f index.html social.html studio.html vj_scratch.html catalog.json _site/ 2>/dev/null || true
          cp -rf output/* _site/output/ 2>/dev/null || true

      - name: Deploy to Netlify
        if: steps.check_netlify.outputs.ready == 'true'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './_site'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy Noir Vault (${{ github.ref_name }})"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ---------------------------------------------------------
  # 3. Vercel (Global Edge CDN & 100GB/mo Free)
  # ---------------------------------------------------------
  deploy-vercel:
    if: ${{ vars.ENABLE_VERCEL != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel Secrets
        id: check_vercel
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "Skipping Vercel: VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID not set."
          fi

      - name: Checkout Repository
        if: steps.check_vercel.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Prepare Clean Static Bundle
        if: steps.check_vercel.outputs.ready == 'true'
        run: |
          mkdir -p _site/output
          cp -f index.html social.html studio.html vj_scratch.html catalog.json _site/ 2>/dev/null || true
          cp -rf output/* _site/output/ 2>/dev/null || true

      - name: Deploy to Vercel
        if: steps.check_vercel.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" _site
          else
            npx --yes vercel@latest deploy --yes --token="$VERCEL_TOKEN" _site
          fi

  # ---------------------------------------------------------
  # 4. Render Static Site (Deploy Hook Trigger)
  # ---------------------------------------------------------
  deploy-render:
    if: ${{ vars.ENABLE_RENDER != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Render static site deployment triggered."
          else
            echo "Skipping Render: RENDER_DEPLOY_HOOK_URL not set."
          fi
